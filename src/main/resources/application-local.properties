# Perfil para correr en el computador sin PostgreSQL: usa H2 en memoria
# con una copia de las migraciones del repositorio de base de datos.
spring.datasource.url=jdbc:h2:mem:ucc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/V1__esquema.sql
spring.sql.init.data-locations=classpath:db/V2__datos_iniciales.sql

