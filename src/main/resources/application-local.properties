# Profile to run on a computer without PostgreSQL: in-memory H2 database
# with a copy of the migrations of the database repository.
spring.datasource.url=jdbc:h2:mem:ucc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/V1__schema.sql,classpath:db/V3__users.sql
spring.sql.init.data-locations=classpath:db/V2__initial_data.sql,classpath:db/V4__video_spaces.sql,classpath:db/V5__walkthrough_adjustments.sql
