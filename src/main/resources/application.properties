spring.application.name=ucc-pasto3d-backend
server.port=${PORT:8080}

# --- Database (Neon PostgreSQL). The schema is managed by the database repository.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ucc_pasto3d}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Artificial intelligence
# (the old Spanish variable names are still accepted so the current Render settings keep working)
ai.provider=${AI_PROVIDER:${IA_PROVEEDOR:gemini}}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:${GEMINI_MODELO:gemini-3.5-flash}}
# Quota proxy: maximum questions per minute sent to Gemini (the rest are answered by the local AI)
ai.gemini.limit-per-minute=${GEMINI_LIMIT_PER_MINUTE:${GEMINI_LIMITE_MINUTO:30}}

# --- Secret used to sign the session tokens (set APP_SECRET in production)
app.secret=${APP_SECRET:${APP_SECRETO:ucc-pasto3d-development-secret-change-in-production}}

# --- CORS: frontend domains separated by commas (e.g. https://ucc-pasto3d.vercel.app)
app.cors.origins=${CORS_ORIGINS:${CORS_ORIGENES:*}}

management.endpoints.web.exposure.include=health

# --- Send the reason of the errors to the frontend (e.g. "Correo o contraseña incorrectos.")
server.error.include-message=always
