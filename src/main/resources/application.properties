spring.application.name=ucc-pasto3d-backend
server.port=${PORT:8080}

# --- Base de datos (Neon PostgreSQL). El esquema lo administra el repositorio de base de datos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ucc_pasto3d}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Inteligencia artificial
ia.proveedor=${IA_PROVEEDOR:gemini}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.modelo=${GEMINI_MODELO:gemini-2.5-flash}

# --- CORS: dominios del frontend separados por coma (ej: https://ucc-pasto3d.vercel.app)
app.cors.origenes=${CORS_ORIGENES:*}

management.endpoints.web.exposure.include=health
